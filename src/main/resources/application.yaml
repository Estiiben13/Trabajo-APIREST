spring:
  datasource:
    url: jdbc:mydb://localhost:3306/mi_base_datos?useSSL=false&serverTimezone=UTC
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # Opciones: none, validate, update, create, create-drop
    show-sql: true       # Muestra las consultas en consola
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL57Dialect
